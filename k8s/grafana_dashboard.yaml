# Deployment 部署
apiVersion: apps/v1  # 指定api版本，此值必须在kubectl api-versions中 
kind: Deployment  # 指定创建资源的角色/类型  
metadata:  # 资源的元数据/属性
  name: dashboard  # 资源的名字，在同一个namespace中必须唯一
  namespace: www # 部署在哪个namespace中
  labels:  # 设定资源的标签
    app: dashboard
    version: stable
spec: # 资源规范字段
  replicas: 4 # 声明副本数目
  revisionHistoryLimit: 3 # 保留历史版本
  selector: # 选择器
    matchLabels: # 匹配标签
      app: dashboard
      version: stable
  strategy: # 策略
    rollingUpdate: # 滚动更新
      maxSurge: 30% # 最大额外可以存在的副本数，可以为百分比，也可以为整数
      maxUnavailable: 30% # 示在更新过程中能够进入不可用状态的 Pod 的最大值，可以为百分比，也可以为整数
    type: RollingUpdate # 滚动更新策略
  template: # 模版
    metadata: # 资源的元数据/属性
      labels: # 设定资源的标签
        app: dashboard
        version: stable
    spec: # 资源规范字段
      containers:
      - name: dashboard # 容器的名字  
        image: reg.aops.com:5000/aops/apissix-dashboard:3.0.1-alpine # 容器使用的镜像地址  
        imagePullPolicy: IfNotPresent # 每次Pod启动拉取镜像策略，三个选择 Always、Never、IfNotPresent
                                      # Always，每次都检查；Never，每次都不检查（不管本地是否有）；IfNotPresent，如果本地有就不检查，如果没有就拉取
        resources: # 资源管理
          limits: # 最大使用
            cpu: 300m # CPU，1核心 = 1000m
            memory: 512Mi # 内存，1G = 1024Mi
          requests:  # 容器运行时，最低资源需求，也就是说最少需要多少资源容器才能正常运行
            cpu: 100m
            memory: 128Mi
        livenessProbe: # pod 内部健康检查的设置
          tcpSocket:
            port: 9000
          initialDelaySeconds: 5 # 表明第一次检测在容器启动后多长时间后开始
          timeoutSeconds: 5 # 检测的超时时间
          periodSeconds: 3 # 检查间隔时间
          successThreshold: 1 # 成功门槛
          failureThreshold: 5 # 失败门槛，连接失败5次，pod杀掉，重启一个新的pod
        readinessProbe: # Pod 准备服务健康检查设置
          tcpSocket:
            port: 9000
          initialDelaySeconds: 5
          timeoutSeconds: 5
          periodSeconds: 3
          successThreshold: 1
          failureThreshold: 5
          #也可以用这种方法  
          #exec: 执行命令的方法进行监测，如果其退出码不为0，则认为容器正常  
          #  command:  
          #    - cat  
          #    - /tmp/health  
          #也可以用这种方法  
          #tcpSocket: # 通过tcpSocket检查健康 
          #  port: number
        ports:
          - name: http-9000 # 名称
            containerPort: 9000 # 容器开发对外的端口
            protocol: TCP # 协议
      # imagePullSecrets: # 镜像仓库拉取密钥
      #   - name: harbor-certification
        volumeMounts: # 挂载的存储卷声明
          - name: dashboard # 挂载卷名称
            mountPath: /usr/local/apisix-dashboard/conf/conf.yaml # 挂载路径
            subPath: conf.yaml # 挂载路径下的子目录
      volumes: # 挂载的存储卷配置
        - name: dashboard # 名称
          configMap: # 挂载配置字典
            name: dashboard # 配置字典名称

---
#service
apiVersion: v1  #service API版本， service.apiVersion  
kind: Service #类型为service  
metadata: #定义service元数据，service.metadasvcta  
  name: dashboard  # 定义Service名称
  namespace: www  #定义命名空间
  labels: #自定义标签，service.metadata.labels
    app: dashboard  #定义service标签的内容
  annotations:   # 备注
    creator: admin # 创建人
spec:  #定义service的详细信息，service.spec  
  ports:
    - name: http-9000    # 定义端口名称
      protocol: TCP       # 定义协议
      port: 9000         # service端口
      targetPort: 9000   # 目标pod端口
  selector:  #service的标签选择器，定义要访问的目标pod
    app: dashboard # 将流量路到选择的pod上，须等于Deployment.spec.selector.matchLabels
    version: stable # 同上两者条件满足时生效
  type: ClusterIP  #service的类型，定义服务的访问方式，默认为ClusterIP， service.spec.type
  sessionAffinity: None
  externalTrafficPolicy: Cluster
